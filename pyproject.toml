[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infant-brain-segmentation"
version = "0.2.0"
description = "Infant brain segmentation workflow and native-grid research audit tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "nibabel>=5,<6", "scipy>=1.10,<2", "matplotlib>=3.7,<4", "jsonschema>=4.21,<5"]

[project.scripts]
neonatal-audit = "neonatal_seg_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neonatal_seg_audit = ["mask_review_prompt.md", "mask_review_schema.json"]
