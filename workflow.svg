<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="730" viewBox="0 0 1080 730" role="img" aria-labelledby="title desc">
  <title id="title">婴儿脑分割研究流程</title>
  <desc id="desc">B路线：独立脑提取后由人工或已有视觉Agent按版本化提示词查看证据，保存回填结果，再由人工确认探索性处理。工具不调用模型或运行分割；脑区另行复核。任一门槛不通过则暂停记录修复。公开版无患者影像。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#526375"/></marker>
    <style>text{font-family:"Noto Sans CJK SC","Noto Sans CJK JP","Microsoft YaHei",sans-serif;fill:#203147}.label{font-size:20px;font-weight:600}.small{font-size:16px}.line{fill:none;stroke:#526375;stroke-width:2;marker-end:url(#arrow)}.box{fill:#f1f5fa;stroke:#b6c5d5;stroke-width:1.5}.gate{fill:#e7f3f0;stroke:#83b7a9;stroke-width:1.5}</style>
  </defs>
  <rect width="1080" height="730" fill="#ffffff"/>
  <text x="40" y="48" font-size="29" font-weight="700">婴儿脑分割</text>
  <text x="40" y="79" class="small">新生儿T2研究流程 · 当前年龄门槛PMA 28–44周 · 非临床诊断产品</text>
  <rect class="box" x="40" y="115" width="300" height="105" rx="13"/>
  <text x="62" y="151" class="label">1　输入与空间检查</text>
  <text x="62" y="181" class="small">全视野T2、PMA、方向及网格</text>
  <text x="62" y="205" class="small">保留原图；记录处理与版本</text>
  <rect class="box" x="390" y="115" width="300" height="105" rx="13"/>
  <text x="412" y="151" class="label">2　独立脑提取</text>
  <text x="412" y="181" class="small">ANUBEX-SA / nnUNet v1</text>
  <text x="412" y="205" class="small">生成二值脑掩膜，不只是裁头</text>
  <rect class="gate" x="740" y="115" width="300" height="105" rx="13"/>
  <text x="762" y="151" class="label">3　掩膜质量复核</text>
  <text x="762" y="181" class="small">人工／Agent辅助逐页看图</text>
  <text x="762" y="205" class="small">证据回填 → 人工技术确认</text>
  <path class="line" d="M340 168 H383"/><path class="line" d="M690 168 H733"/>
  <rect class="box" x="740" y="288" width="300" height="115" rx="13"/>
  <text x="762" y="327" class="label">4　全新DrawEM</text>
  <text x="762" y="357" class="small">空目录预置通过复核的掩膜</text>
  <text x="762" y="382" class="small">N4 → 先验/配准 → EM/后处理</text>
  <path class="line" d="M890 220 V280"/><text x="905" y="255" class="small">人工确认</text>
  <rect class="gate" x="390" y="288" width="300" height="115" rx="13"/>
  <text x="412" y="327" class="label">5　组织与脑区门槛</text>
  <text x="412" y="357" class="small">灰白质、深部、海马及后颅窝</text>
  <text x="412" y="382" class="small">区域边界通过≠仅外轮廓好看</text>
  <path class="line" d="M740 345 H697"/>
  <rect class="box" x="40" y="288" width="300" height="115" rx="13"/>
  <text x="62" y="327" class="label">6　体积与方法比较</text>
  <text x="62" y="357" class="small">最终个体网格计量、标签表核对</text>
  <text x="62" y="382" class="small">参考协议统一；Dice≠准确率</text>
  <path class="line" d="M390 345 H347"/><text x="350" y="332" class="small">通过</text>
  <rect class="box" x="40" y="470" width="300" height="100" rx="13"/>
  <text x="62" y="507" class="label">7　版本归档与研究纳入</text>
  <text x="62" y="538" class="small">SHA-256、配置、复核与纳入记录</text>
  <path class="line" d="M190 403 V463"/>
  <rect x="430" y="470" width="610" height="100" rx="13" fill="#fff3e6" stroke="#d7ab75" stroke-width="1.5"/>
  <text x="452" y="507" class="label">未通过任一质量门槛：暂停 → 记录 → 修复 → 再复核</text>
  <text x="452" y="538" class="small">不自动删小标签、不强行对称、不自动覆盖正式结果</text>
  <path class="line" d="M1040 180 H1056 V520 H1043"/><text x="943" y="441" class="small">未通过</text>
  <path class="line" d="M540 403 V463"/><text x="553" y="438" class="small">未通过</text>
  <path d="M40 621 H1040" stroke="#d5dee8"/>
  <text x="40" y="655" class="small">A基线：BET＋DrawEM　｜　B候选：ANUBEX-SA脑掩膜＋全新DrawEM</text>
  <text x="40" y="686" class="small">v0.2含复核程序与提示词；不调用AI、不自动验收；软件/模型/图谱需另备。</text>
</svg>
